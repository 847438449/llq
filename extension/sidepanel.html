<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AI Browser Agent</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 12px; }
      textarea { width: 100%; min-height: 90px; }
      input, button { width: 100%; margin-top: 8px; padding: 8px; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 8px; margin-top: 10px; }
      .small { font-size: 12px; color: #555; }
      pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; }
      .step { margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    </style>
  </head>
  <body>
    <h3>AI Browser Agent</h3>
    <label>Backend API URL</label>
    <input id="apiUrl" value="http://localhost:8000/api/tasks/run" />

    <label>Task</label>
    <textarea id="task" placeholder="Summarize this page and capture screenshot"></textarea>
    <button id="runBtn">Run Task</button>

    <div id="status" class="small"></div>

    <div class="card">
      <strong>Current Task</strong>
      <pre id="taskOut">-</pre>
    </div>

    <div class="card">
      <strong>Step Execution</strong>
      <div id="stepsOut"></div>
    </div>

    <div class="card">
      <strong>Logs</strong>
      <pre id="logsOut">-</pre>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
